<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>💌 Khusus Buat Kamu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    #app {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff5f7 0%, #fff0f5 50%, #fdf5ff 100%);
      padding: 2.5rem 1.2rem;
    }

    .card {
      background: #ffffff;
      border-radius: 32px;
      padding: 3.5rem 2rem 2.8rem;
      width: 100%;
      max-width: 460px;
      text-align: center;
      position: relative;
      overflow: visible;
      box-shadow: 0 8px 40px rgba(216,90,100,0.12), 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid rgba(240,180,200,0.25);
    }

    .deco-top {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #f9a8c0, #f472b6);
      border-radius: 50px;
      padding: 8px 24px;
      font-size: 14px;
      color: #fff;
      font-weight: 500;
      white-space: nowrap;
      box-shadow: 0 2px 10px rgba(244,114,182,0.4);
    }

    .petals {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: 32px;
    }

    .petal {
      position: absolute;
      font-size: 20px;
      opacity: 0.16;
      animation: floatPetal 6s ease-in-out infinite;
    }

    @keyframes floatPetal {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.12; }
      50% { transform: translateY(-10px) rotate(15deg); opacity: 0.22; }
    }

    .emoji-wrap {
      display: inline-block;
      margin-bottom: 1.4rem;
      margin-top: 0.4rem;
    }

    .emoji-big {
      font-size: 80px;
      display: block;
      animation: floatEmoji 2.4s ease-in-out infinite;
      filter: drop-shadow(0 4px 14px rgba(244,114,182,0.28));
      line-height: 1;
    }

    @keyframes floatEmoji {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.06); }
    }

    .title {
      font-size: 26px;
      font-weight: 600;
      color: #2d1a2e;
      margin-bottom: 0.8rem;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 16px;
      color: #7a5a7a;
      line-height: 1.8;
      margin-bottom: 2.4rem;
      padding: 0 0.3rem;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .btn-yes {
      background: linear-gradient(135deg, #f472b6, #ec4899);
      color: #fff;
      border: none;
      padding: 16px 40px;
      border-radius: 50px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 18px rgba(236,72,153,0.38);
      flex-shrink: 0;
      touch-action: manipulation;
      user-select: none;
      -webkit-appearance: none;
      transition: transform 0.12s;
    }

    .btn-yes:active { transform: scale(0.95); }

    .btn-no {
      background: #fdf2f8;
      color: #b06090;
      border: 1px solid rgba(240,100,180,0.25);
      padding: 16px 28px;
      border-radius: 50px;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      width: auto;
      min-width: max-content;
      flex-shrink: 0;
      -webkit-appearance: none;
      touch-action: none;
      user-select: none;
      display: inline-block;
    }

    .btn-no.floating {
      position: fixed;
      z-index: 9999;
      touch-action: none;
      width: auto !important;
      min-width: max-content;
      white-space: nowrap;
      transition: left 0.28s cubic-bezier(.4,1.5,.6,1), top 0.28s cubic-bezier(.4,1.5,.6,1);
    }

    .hearts-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: 32px;
    }

    .heart-float {
      position: absolute;
      opacity: 0;
      font-size: 18px;
      animation: riseHeart 4s ease-in infinite;
    }

    @keyframes riseHeart {
      0% { opacity: 0; transform: translateY(0) scale(0.5); }
      20% { opacity: 0.5; }
      100% { opacity: 0; transform: translateY(-200px) scale(1.2); }
    }

    .confetti-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: 32px;
    }

    .particle {
      position: absolute;
      opacity: 0;
      animation: fall 2.2s ease-in forwards;
    }

    @keyframes fall {
      0% { opacity: 1; transform: translateY(-20px) rotate(0deg); }
      100% { opacity: 0; transform: translateY(500px) rotate(720deg); }
    }

    @keyframes popSpin {
      0% { transform: scale(0.3) rotate(-180deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .quote-box {
      margin-top: 1.6rem;
      background: linear-gradient(135deg, #fdf2f8, #fce7f3);
      border-radius: 18px;
      padding: 1.1rem 1.3rem;
      border: 1px solid rgba(240,100,180,0.15);
    }

    .quote-box p {
      font-size: 15px;
      color: #9d5070;
      line-height: 1.75;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="card" id="card">
      <div class="deco-top">BUAT CACAA CANTIKKK🥰</div>
      <div class="petals">
        <span class="petal" style="top:10%;left:8%;animation-delay:0s;">🌸</span>
        <span class="petal" style="top:70%;left:5%;animation-delay:1.2s;">🌺</span>
        <span class="petal" style="top:20%;right:7%;animation-delay:0.6s;">🌸</span>
        <span class="petal" style="top:75%;right:6%;animation-delay:2s;">💮</span>
        <span class="petal" style="top:45%;left:3%;animation-delay:1.8s;">🌸</span>
        <span class="petal" style="top:50%;right:4%;animation-delay:0.3s;">🌺</span>
      </div>
      <div class="hearts-bg" id="hearts-bg"></div>
      <div class="emoji-wrap">
        <span class="emoji-big" id="emoji">🥺</span>
      </div>
      <h1 class="title" id="main-title">Aku minta maaf yang kemarin yaaa..</h1>
      <p class="subtitle" id="main-sub">Aku tau kamu masii marahh gituu soalnya keliatan mutungnyaa😔.jadi aku mauu bener benerr mau minta maaf. Mau maafin aku nggak? 🙏</p>
      <div class="btn-group" id="btn-group">
        <button class="btn-yes" id="btn-yes">Iya, aku maafin 💖</button>
        <button class="btn-no" id="btn-no">Nggak mau</button>
      </div>
    </div>
  </div>

  <script>
    const stages = [
      { emoji:"😢", title:"caa pelisss", sub:"Aku serius nih. akuu ga adaa niatan buat jadi annoying ke kamuuu kemarinn,maafin akuuu pelissss? 🥺", noText:"Masih nggak mau" },
      { emoji:"😭", title:"caaaaaa pelissssssssss", sub:"darii tadii aku kepikiran gimana caranya biar kamu ga mutunggg tauu😭😭", noText:"Tetep nggak~" },
      { emoji:"🥹", title:"cacaaa....🥹", sub:"Kamu itu spesial banget buatt akuu. Maafin aku, ya? peliissss😭. 🙏", noText:"Hmm... nggak ah" },
      { emoji:"😖", title:"seriuss iniiii", sub:"aku bener bener nyeselll soal yang kemarinnn dan ga mau ngulang lagiii kaya gituuuu, mau kah maafin akuuu🥹", noText:"g" },
      { emoji:"💌", title:"Dearr Cacaaaa...", sub:"\"Kepada kamu yang selalu ada di pikiranku 😽— aku salah, aku minta maaf, dan aku berharap kamu mau maafin aku.\" 🥹", noText:"hmmm" },
      { emoji:"⭐", title:"Ini yang terakhir...", sub:"kasiii tauu aku nantii gimana caranya biar kamu ga lagi mutung gituu sama akuu", noText:"y" },
    ];

    let stage = 0, hasFloated = false, isMoving = false;
    const noBtn = document.getElementById('btn-no');
    const yesBtn = document.getElementById('btn-yes');

    (function() {
      let c = document.getElementById('hearts-bg');
      ['💗','💌','😽','😼','🥰'].forEach((e,i) => {
        let h = document.createElement('span');
        h.className = 'heart-float';
        h.textContent = e;
        h.style.cssText = `left:${10+i*17}%;bottom:0;animation-delay:${i*0.9}s;animation-duration:${3.5+Math.random()*2}s`;
        c.appendChild(h);
      });
    })();

    function getRandPos() {
      let vw = window.innerWidth, vh = window.innerHeight;
      let bw = noBtn.offsetWidth || 160;
      let bh = noBtn.offsetHeight || 56;
      let m = 10;
      return {
        x: Math.max(m, Math.random() * (vw - bw - m * 2)),
        y: Math.max(m, Math.random() * (vh - bh - m * 2))
      };
    }

    function makeFloat() {
      if (hasFloated) return;
      hasFloated = true;
      let r = noBtn.getBoundingClientRect();
      noBtn.style.left = r.left + 'px';
      noBtn.style.top = r.top + 'px';
      // Tidak set width — biarkan auto mengikuti teks
      noBtn.classList.add('floating');
    }

    function flee() {
      if (isMoving) return;
      isMoving = true;
      if (!hasFloated) makeFloat();
      // Delay kecil agar browser render ulang ukuran tombol setelah teks berubah
      setTimeout(() => {
        let p = getRandPos();
        noBtn.style.left = p.x + 'px';
        noBtn.style.top = p.y + 'px';
        setTimeout(() => { isMoving = false; }, 380);
      }, 30);
    }

    function updateStage() {
      if (stage >= stages.length) return;
      let s = stages[stage++];
      document.getElementById('emoji').textContent = s.emoji;
      document.getElementById('main-title').textContent = s.title;
      document.getElementById('main-sub').textContent = s.sub;
      noBtn.textContent = s.noText;
    }

    noBtn.addEventListener('mouseenter', flee);

    document.addEventListener('touchmove', function(e) {
      if (isMoving) return;
      let t = e.touches[0];
      let r = noBtn.getBoundingClientRect();
      let buf = 70;
      if (t.clientX > r.left-buf && t.clientX < r.right+buf &&
          t.clientY > r.top-buf && t.clientY < r.bottom+buf) {
        flee();
      }
    }, { passive: true });

    noBtn.addEventListener('touchstart', function(e) {
      e.preventDefault();
      updateStage();
      flee();
    }, { passive: false });

    noBtn.addEventListener('click', function() {
      updateStage();
      flee();
    });

    document.getElementById('card').addEventListener('touchstart', function() {
      if (!hasFloated) makeFloat();
    }, { passive: true });

    yesBtn.addEventListener('click', handleYes);
    yesBtn.addEventListener('touchend', function(e) { e.preventDefault(); handleYes(); }, { passive: false });

    function handleYes() {
      noBtn.style.display = 'none';
      let card = document.getElementById('card');
      card.innerHTML = `
        <div class="petals">
          <span class="petal" style="top:10%;left:8%;">🌸</span>
          <span class="petal" style="top:70%;left:5%;animation-delay:1.2s;">🌺</span>
          <span class="petal" style="top:20%;right:7%;animation-delay:0.6s;">🌸</span>
          <span class="petal" style="top:75%;right:6%;animation-delay:2s;">💮</span>
        </div>
        <div class="confetti-wrap" id="confetti"></div>
        <div class="deco-top" style="background:linear-gradient(135deg,#a78bfa,#ec4899);">🎉 Yeay!</div>
        <div class="emoji-wrap" style="margin-top:0.6rem;">
          <span class="emoji-big" style="animation:popSpin 0.5s ease-out,floatEmoji 2.4s 0.5s ease-in-out infinite;">🥰</span>
        </div>
        <h1 class="title" style="color:#6d1f5e;">Makasih banyak, ya!</h1>
        <p class="subtitle">Kamu baik banget mau maafin aku. Aku janji bakal jadi lebih baik dan lebih hati-hati. 💖</p>
        <div class="quote-box">
          
        </div>
      `;
      card.style.cssText += 'border:1px solid rgba(236,72,153,0.25);box-shadow:0 8px 48px rgba(236,72,153,0.18);';
      launchConfetti('confetti');
    }

    function launchConfetti(id) {
      let c = document.getElementById(id);
      if (!c) return;
      let colors = ['#f472b6','#a78bfa','#fb923c','#34d399','#60a5fa','#fbbf24','#f9a8d4'];
      for (let i = 0; i < 50; i++) {
        let p = document.createElement('div');
        p.className = 'particle';
        let sz = 6 + Math.random() * 10;
        p.style.cssText = `left:${Math.random()*100}%;top:-10px;background:${colors[i%colors.length]};animation-delay:${Math.random()*1.6}s;animation-duration:${1.6+Math.random()}s;width:${sz}px;height:${sz}px;border-radius:${Math.random()>0.5?'50%':'3px'}`;
        c.appendChild(p);
      }
    }
  </script>
</body>
</html>
